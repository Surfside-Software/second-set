name: Unsigned desktop release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    name: Build (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    # Pull requests run Windows and macOS only for platform-sensitive changes, and main runs Linux
    # alone, so every release tag repeats the unit tests on all three before publishing. Each OS
    # then builds its installers and drives the packaged app through the Electron suite, as
    # ci.yml does. Type checks, lint and formatting give the same result on every OS and run on
    # Linux for every pull request and push to main.
    steps:
      # repos/ holds vendored reference source that no check, build or test reads.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/repos/
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Verify tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun -e 'const p=require("./package.json"); if (process.env.RELEASE_TAG !== `v${p.version}`) process.exit(1)'
      # Tests open SQLite with synchronous=FULL in the temporary directory, which defaults to C:.
      # The hosted runner's D: drive, which also holds the workspace, is faster for this I/O.
      # Bun's package store moves there too, so installs hard-link into node_modules on one drive.
      - name: Use the D drive for temporary files on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "tmp"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          "TEMP=$temp" >> $env:GITHUB_ENV
          "TMP=$temp" >> $env:GITHUB_ENV
          "BUN_INSTALL_CACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'bun-cache')" >> $env:GITHUB_ENV
      # No dependency cache, as in ci.yml: a fresh install is faster than restoring one.
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - run: bun --bun electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Test packaged application on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run test:packaged
      - name: Test packaged application on Windows and macOS
        if: runner.os != 'Linux'
        run: bun run test:packaged
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/*.yml
  publish:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Hash release artifacts
        working-directory: artifacts
        run: find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* --repo "$REPOSITORY" --verify-tag --generate-notes
